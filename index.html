<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma surpresa para você... ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #ffe6e9 0%, #ffb6c1 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
    }
    h1 {
      color: #d63384;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    p.pensamento {
      color: #555;
      font-size: 0.92rem;
      line-height: 1.4;
      font-style: italic;
      margin-top: 0;
      margin-bottom: 18px;
    }
    p.subtitulo {
      color: #333;
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #btn-sim {
      background-color: #ff4081;
      color: white;
    }
    #btn-nao {
      background-color: #6c757d;
      color: white;
    }
    #mensagem {
      display: none;
      font-size: 1.4rem;
      color: #d63384;
      font-weight: bold;
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="conteudo-principal">
      <h1 id="titulo">Patrícia... ✨</h1>
      <p class="pensamento">
        Falo com você todo dia? Não, prefiro deixar fluir no seu tempo. 🙈<br>
        Mas penso em você todo dia e desejo seu bem? Sim. 💭
      </p>
      <p class="subtitulo">Aceita sair comigo para um lugar legal? 🌹</p>

      <div class="buttons" id="painel-botoes">
        <button id="btn-sim" onclick="aceitou()">Sim</button>
        <button id="btn-nao" onclick="desviar(this)" ontouchstart="desviar(this)">Não</button>
      </div>
    </div>

    <div id="mensagem">
      🎉 Ebaaaaa! Mal posso esperar! Me avisa qual dia e horário você prefere! 🥰✨
    </div>
  </div>

  <script>
    function desviar(btn) {
      const largura = window.innerWidth - btn.offsetWidth - 40;
      const altura = window.innerHeight - btn.offsetHeight - 40;
      const novaEsquerda = Math.max(20, Math.floor(Math.random() * largura));
      const novaTop = Math.max(20, Math.floor(Math.random() * altura));
      btn.style.position = "fixed";
      btn.style.left = novaEsquerda + "px";
      btn.style.top = novaTop + "px";
    }

    function aceitou() {
      document.getElementById("conteudo-principal").style.display = "none";
      document.getElementById("mensagem").style.display = "block";
    }
  </script>

</body>
</html>
